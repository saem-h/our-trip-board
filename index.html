/* Layout: one slim header row, one summary line, a compact info panel (교통, 숙소), then section tabs with a tight list on the left and a light timeline on the right (switchable on phones). Black and white with one lime point color. */
:root{
  --bg:#FFFFFF; --surface:#FFFFFF; --ink:#0A0A0A; --muted:#6C6C6C; --line:#E3E3E3; --soft:#F4F4F4;
  --accent:#C8FF2E; --accent-ink:#0A0A0A; --danger:#E5221B; --ph:#6C6C6C; --scrim:rgba(0,0,0,.6); --card:var(--bg); --card-line:var(--ink); --field:var(--bg);
  --font-en:'BBB Event',Pretendard,sans-serif;
  --font-body:Pretendard,'Noto Sans KR',-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0B0B0B; --surface:#161616; --ink:#FFFFFF; --muted:#B8B8B8; --line:#353535; --soft:#1E1E1E; --ph:#8A8A8A; --scrim:rgba(0,0,0,.8); --card:#161616; --card-line:#3A3A3A; --field:#0B0B0B;
    --accent:#C8FF2E; --accent-ink:#0A0A0A; --danger:#FF6B63; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0B0B0B; --surface:#161616; --ink:#FFFFFF; --muted:#B8B8B8; --line:#353535; --soft:#1E1E1E; --ph:#8A8A8A; --scrim:rgba(0,0,0,.8); --card:#161616; --card-line:#3A3A3A; --field:#0B0B0B;
  --accent:#C8FF2E; --accent-ink:#0A0A0A; --danger:#FF6B63; color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.5;letter-spacing:-0.01em;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 64px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit;letter-spacing:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.wrap{max-width:1080px;margin:0 auto}
header.top{display:flex;align-items:center;gap:8px 18px;flex-wrap:wrap;padding:18px 0 10px}
h1{font-family:var(--font-en);font-weight:400;font-size:30px;margin:0;letter-spacing:0;line-height:1.1;text-transform:lowercase;flex:none}
.en{font-family:var(--font-en);text-transform:lowercase;font-size:16px;letter-spacing:.02em;font-weight:400}
.tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;min-width:0;flex:1}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;border:1px solid var(--line);background:transparent;border-radius:999px;padding:5px 14px;min-height:34px;white-space:nowrap;font-weight:600;font-size:14px}
.tab[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tab.ghost{border-style:dashed;color:var(--muted);font-weight:500}
.tab-x{flex:none;border:0;background:none;color:var(--muted);font-size:13px;font-weight:500;padding:5px 6px;min-height:34px;white-space:nowrap}
.tab-x:disabled{opacity:.4}
.invite{flex:none;margin-left:auto;display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:none;color:var(--ink);border-radius:999px;padding:5px 12px 5px 10px;min-height:34px;font-size:13px;font-weight:600;white-space:nowrap}
.invite svg{width:16px;height:16px}
.invite{position:relative}
.invite.bell{margin-left:0;order:1;padding:0;width:34px;justify-content:center}
.invite.bell.on::after{content:'';position:absolute;top:5px;right:5px;width:7px;height:7px;border-radius:50%;background:#C8FF2E;border:1.5px solid var(--bg)}
.brd{border:0;background:none;padding:0;margin:0;font:inherit;color:inherit;letter-spacing:inherit;text-transform:inherit;display:inline-flex;align-items:center;gap:6px;cursor:pointer}
.brd>svg{width:14px;height:14px;flex:none;color:var(--muted);margin-top:4px}
.bl{display:flex;flex-direction:column;margin:4px 0 2px}
.bl-w{display:flex;align-items:center;gap:4px;border-bottom:1px solid var(--line)}
.bl-w:last-child{border-bottom:0}
.bl-w .bl-r{flex:1;border-bottom:0;min-width:0}
.bl-x{font-size:12px;color:var(--danger);padding:0 2px 10px;line-height:1.5}
.bl-r{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 2px;border-bottom:1px solid var(--line);color:var(--ink);text-decoration:none;min-height:48px}
.bl-r:last-child{border-bottom:0}
.bl-t{font-weight:600;font-size:15px;overflow-wrap:anywhere}
.bl-c{flex:none;font-size:12px;font-weight:600;background:var(--lime,#C8FF2E);color:#0a0a0a;border-radius:999px;padding:2px 9px}
.bl-a{flex:none;color:#C4C4C4;font-size:20px}
.bl-n{font-size:12px;color:var(--muted);margin:0;line-height:1.5}
.note{margin:10px 0 0;padding:10px 14px;border:1px solid var(--ink);border-radius:10px;font-size:13px}
.bar{display:flex;align-items:center;gap:6px 14px;flex-wrap:wrap;padding:9px 14px;border:1px solid var(--line);border-radius:14px}
.dd{background:var(--accent);color:var(--accent-ink);border:1px solid var(--ink);border-radius:999px;padding:1px 14px;font-family:var(--font-en);font-size:22px;line-height:1.4;text-transform:lowercase;white-space:nowrap}
.dt{font-weight:700;font-size:14px}
.st{color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
.st b{color:var(--ink);font-weight:700}
.sp{flex:1}
.linkbtn{border:0;background:none;color:var(--muted);padding:2px 0;text-decoration:underline;text-underline-offset:3px;font-size:13px}
.pin{margin-top:10px;border:1px solid var(--line);border-radius:14px;padding:4px 14px 2px}
.pin-h{display:flex;align-items:center;gap:8px;padding:6px 0}
.pin-h .en{font-size:16px}
.pin-h b{font-size:13px;font-weight:600;color:var(--muted)}
.pin-h .lb{margin-left:auto}
.pin-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:0 28px;padding-bottom:4px}
.pg{min-width:0;padding-bottom:6px}
.pg-h{display:flex;align-items:center;justify-content:space-between;font-weight:800;font-size:13px;letter-spacing:-0.02em;padding:4px 0;border-bottom:1.5px solid var(--ink)}
.pin-empty{color:var(--muted);font-size:13px;padding:8px 0}
.tf{display:flex;flex-wrap:wrap;gap:6px;padding:8px 0 2px}
.tf .chip{min-height:28px!important;padding:2px 10px!important;font-size:12.5px!important}
.tf .chip i{margin-left:5px;font-size:11px!important}
.pr{display:flex;gap:10px;justify-content:space-between;align-items:flex-start;padding:7px 0;border-bottom:1px solid var(--line)}
.pr:last-child{border-bottom:0}
.pr-main{min-width:0;flex:1}
.pr-n{font-weight:700;font-size:14px;overflow-wrap:anywhere}
.pr-tag{display:inline-block;font-size:11px;font-weight:600;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:0 8px;margin-right:6px;vertical-align:1px}
.pr-s{font-weight:400;color:var(--muted);font-size:13px}
.pr-w{font-size:13px;font-weight:600;margin-top:1px;font-variant-numeric:tabular-nums}
.pr-m{font-size:12.5px;color:var(--muted);white-space:pre-wrap;overflow-wrap:anywhere}
.pr-l{font-size:12px;color:var(--muted);text-underline-offset:3px;overflow-wrap:anywhere}
.pr-act{display:flex;gap:10px;flex:none}
a.it-t{color:inherit;text-decoration:none;display:inline-block;max-width:100%;vertical-align:top;-webkit-tap-highlight-color:transparent}
.ev-n a,.pr-n a{color:inherit;text-decoration:none}
a.it-t:active,.ev-n a:active,.pr-n a:active{opacity:.55}
.pr{cursor:pointer;-webkit-tap-highlight-color:transparent}
.pr:active{background:var(--soft)}
.it-ed{display:flex;gap:0;flex:none;align-items:center}
.ib.ed{color:#9A9A9A}.ib.ed svg{width:17px;height:17px}.ib.ed.warn{color:var(--danger);width:auto!important;padding:0 6px;font-size:12px}
.pr-go{flex:none;align-self:center;color:#C4C4C4;font-size:20px;line-height:1;padding-left:4px}
.bar .gear{display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;border:0;background:none;color:var(--muted);padding:0;margin-left:2px}
.bar .gear svg{width:19px;height:19px}
.bar .bell{position:relative}
.bar .bell.on::after{content:'';position:absolute;top:6px;right:6px;width:7px;height:7px;border-radius:50%;background:#C8FF2E;border:1.5px solid var(--bg)}
.mates{font-size:13px;color:var(--muted);margin-left:0;padding-left:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:40vw}
.pr-f{display:flex;align-items:center;gap:0;margin-top:1px;font-size:13px;min-height:26px}
.pr-fl{color:var(--muted);font-size:12px;flex:none;width:60px}
.pr-fv{font-weight:600;letter-spacing:.02em;font-variant-numeric:tabular-nums;overflow-wrap:anywhere;min-width:0}
.cpy{flex:none;width:26px;height:26px;margin:-4px 0 -4px 2px;display:inline-flex;align-items:center;justify-content:center;border:0;border-radius:6px;background:none;color:var(--muted);padding:0;vertical-align:middle}
.cpy svg{width:14px!important;height:14px!important;flex:none}
.pr-ew{font-size:12px;color:var(--danger);margin-top:2px}
.pass-note{font-size:12px;color:var(--muted);margin:0;line-height:1.5}
.pr-fno{color:var(--muted);font-weight:600;margin-left:8px;letter-spacing:.02em;white-space:nowrap}
.cpy:active{background:var(--line)}
.lb{background:none;border:0;color:var(--muted);text-decoration:underline;text-underline-offset:3px;font-size:12px;padding:2px 0}
.lb.add{color:var(--ink);font-weight:600;text-decoration:none;font-size:12px;border:1px solid var(--line);border-radius:999px;padding:1px 10px}
.lb.warn{color:var(--danger)}

var imp=null;
function impPeople(d){
  var ids={},names={},used={};
  Object.keys(d.members||{}).forEach(function(k){var m=d.members[k];if(m&&m.name){ids[k]=1;names[k]=m.name;}});
  [['u_sami','새미'],['u_juseong','주성']].forEach(function(p){if(!names[p[0]])names[p[0]]=p[1];});
  Object.keys(d.items||{}).forEach(function(k){var i=d.items[k]||{};
    if(i.createdBy)ids[i.createdBy]=1;if(i.who)ids[i.who]=used[i.who]=1;
    Object.keys(i.likes||{}).forEach(function(x){ids[x]=used[x]=1;});Object.keys(i.doneBy||{}).forEach(function(x){ids[x]=used[x]=1;});});
  return Object.keys(ids).filter(function(k){return k&&!members[k]&&(names[k]||used[k]);}).map(function(k){return {id:k,name:names[k]||''};})
    .sort(function(a,b){return (b.name?1:0)-(a.name?1:0);});
}
function impGuess(nm){

  var ks=Object.keys(members),hit=ks.filter(function(k){var n=(members[k]&&members[k].name)||'';return n&&(n.indexOf(nm)>-1||nm.indexOf(n)>-1);});

}

function itemFrom(el){var n=el.closest('[data-id]');if(!n)return null;return items.filter(function(i){return i.id===n.dataset.id;})[0]||null;}
var commitOrder=guarded(function(){
  var t=trip(),jobs=[];
  document.querySelectorAll('.tl-day[data-d]').forEach(function(day){
    var d=parseInt(day.dataset.d,10)||0,i=0;
    day.querySelectorAll('.tl-list .ev').forEach(function(ev){
      var key=ev.dataset.key;if(!key)return;i++;var ord=i*10;
      if(/^s[io]/.test(key)&&!items.some(function(x){return x.id===key;})){
        var sid=key.slice(2),f=key.charAt(1)==='i'?'ordIn':'ordOut',st=items.filter(function(x){return x.id===sid;})[0];
        if(st&&st[f]!==ord){var o={};o[f]=ord;jobs.push(db.doc('items/'+sid).update(o));}
        return;
      }
      var it=items.filter(function(x){return x.id===key;})[0];if(!it)return;
      var data={},ch=false;
      if(it.ord!==ord){data.ord=ord;ch=true;}
      if(it.section!=='transport'&&effDay(it,t)!==d){data.day=d;if(it.date)data.date='';ch=true;}
      if(ch)jobs.push(db.doc('items/'+key).update(data));
    });
  });
  return Promise.all(jobs);
});

var dhWait=null;
function dhCancel(){if(dhWait){clearTimeout(dhWait.tm);dhWait.h.classList.remove('arm');dhWait=null;}}
function dragStart(e){
  var h=e.target.closest&&e.target.closest('.dh');if(!h||!canWrite||drag)return;
  var ev=h.closest('.ev');if(!ev)return;
  if(e.pointerType&&e.pointerType!=='mouse'){
    dhCancel();h.classList.add('arm');
    dhWait={h:h,x:e.clientX,y:e.clientY,tm:setTimeout(function(){var w=dhWait;dhWait=null;if(!w||drag)return;w.h.classList.remove('arm');haptic();dragBegin(w.h,w.h.closest('.ev'),w.x,w.y);},350)};
    return;
  }
  e.preventDefault();
  dragBegin(h,ev,e.clientX,e.clientY);
}
function dragBegin(h,ev,cx,cy){
  if(!ev||!ev.isConnected||!ev.parentNode)return;
  var e={clientY:cy};
  var r=ev.getBoundingClientRect(),ph=document.createElement('div');
  ph.className='ev-ph';ph.style.height=r.height+'px';
  ev.parentNode.insertBefore(ph,ev);
  drag={ev:ev,ph:ph,dy:e.clientY-r.top,left:r.left,w:r.width};dragActive=true;
  ev.style.width=r.width+'px';ev.style.left=r.left+'px';ev.style.top=r.top+'px';ev.classList.add('dragging');
}
function dragMove(e){
  if(dhWait){if(Math.abs(e.clientX-dhWait.x)>8||Math.abs(e.clientY-dhWait.y)>8)dhCancel();return;}
  if(!drag)return;
  var y=e.clientY;
  drag.ev.style.top=(y-drag.dy)+'px';
  if(y<70)window.scrollBy(0,-14);else if(y>window.innerHeight-70)window.scrollBy(0,14);
  var el=document.elementFromPoint(e.clientX,e.clientY);if(!el)return;
  var tgt=el.closest('.ev'),ph=drag.ph;
  if(tgt&&tgt!==drag.ev){var r=tgt.getBoundingClientRect();tgt.parentNode.insertBefore(ph,y>r.top+r.height/2?tgt.nextSibling:tgt);return;}
  var day=el.closest('.tl-day[data-d]');
  if(day&&!tgt){var l=day.querySelector('.tl-list');if(l&&!l.contains(ph)){var em=l.querySelector('.tl-empty');if(em)em.style.display='none';l.appendChild(ph);}}
}
function dragEnd(){
  dhCancel();
  if(!drag)return;
  var d=drag;drag=null;
  d.ph.parentNode.insertBefore(d.ev,d.ph);d.ph.remove();
  d.ev.classList.remove('dragging');d.ev.style.cssText='';
  document.querySelectorAll('.tl-empty').forEach(function(x){x.style.display='';});
  document.querySelectorAll('.tl-list').forEach(function(l){var has=l.querySelector('.ev');var em=l.querySelector('.tl-empty');if(em)em.style.display=has?'none':'';});
  commitOrder();
  dragActive=false;
  if(renderPending){renderPending=false;setTimeout(render,0);}
}

function cdBegin(){

function cdMove(x,y){
  cd.x=x;cd.y=y;
  cd.g.style.transform='translate('+x+'px,'+y+'px) translate(-50%,-150%)';
  var el=document.elementFromPoint(x,y),ph=cd.ph;cd.tgt=null;cdClear();

  if(!l){if(ph.parentNode)ph.remove();cdEmpty();return;}

function cdTick(){

function cdEnd(ok){

function burst(x,y,el){

  var C=['#C8FF2E','#d6ff5c','#b6ee1c','#e4ff94','#a8dc0e'];
  for(var i=0;i<13;i++){(function(){
    var p=document.createElement('i'),w=5+Math.random()*5,h=3+Math.random()*3;
    p.style.cssText='position:fixed;left:'+x+'px;top:'+y+'px;width:'+w+'px;height:'+h+'px;margin:'+(-h/2)+'px 0 0 '+(-w/2)+'px;border-radius:1px;background:'+C[Math.floor(Math.random()*C.length)]+';pointer-events:none;z-index:200;opacity:0;will-change:transform,opacity';

      {transform:'translate('+(dx+drift)+'px,'+(dy+25)+'px) rotate('+rot+'deg) scale(.35)',opacity:0,offset:1}

function loadProfiles(){
  if(!user||!user.profiles)return;
  var ids={};items.forEach(function(i){likeIds(i).forEach(function(k){ids[k]=1;});if(i.createdBy)ids[i.createdBy]=1;});
  if(uid)ids[uid]=1;
  var need=Object.keys(ids).filter(function(k){return !(k in profs);});
  if(!need.length)return;
  need.forEach(function(k){profs[k]=null;});
  user.profiles(need).then(function(ps){need.forEach(function(k){profs[k]=ps[k]||null;});render();}).catch(function(){});
}
var acBusy=false,acTried={};
function autoClosed(){
  if(acBusy||!db||!canWrite||API_URL.indexOf('http')!==0)return;
  var it=items.filter(function(i){return DESC[i.section]&&i.closedSrc==null&&!acTried[i.id]&&/naver\.(me|com)/i.test(safeUrl(i.link));})[0];
  if(!it)return;
  acBusy=true;acTried[it.id]=1;
  fetch(API_URL+'?action=place&url='+encodeURIComponent(safeUrl(it.link))).then(function(r){return r.json();}).then(function(j){
    if(j&&j.ok&&Array.isArray(j.closed)&&items.some(function(x){return x.id===it.id;}))return db.doc('items/'+it.id).update({closed:j.closed,closedSrc:'naver'});
  }).catch(function(){}).then(function(){acBusy=false;setTimeout(autoClosed,300);});
}
function isArchived(t){return t.archived===true||(t.archived!==false&&!!t.endDate&&t.endDate<todayStr());}
var showArc=false,lastLive=null;
function pickTrip(){
  if(!trips.length){tripId=null;return;}
  var cur=trips.filter(function(t){return t.id===tripId;})[0];
  if(cur){showArc=isArchived(cur);return;}
  var saved=lsGet('tripId'),live=trips.filter(function(t){return !isArchived(t);});
  var st=trips.filter(function(t){return t.id===saved&&!isArchived(t);})[0];
  var pick=st||live[0]||trips[trips.length-1];
  tripId=pick.id;showArc=isArchived(pick);
}
async function init(){
  render();
  var c=window.claude;
  if(!c||!c.use){offline=true;ready=true;render();return;}
  try{user=await c.use('user');}catch(e){user=null;}
  try{db=await c.use('db');}catch(e){db=null;}
  if(!db){offline=true;ready=true;render();return;}
  try{uid=user?await user.id():null;}catch(e){uid=null;}
  try{var cw=user?await user.can('data.write'):null;canWrite=cw!==false;}catch(e){canWrite=true;}
  var gotT=false,gotI=false;
  function maybe(){if(gotT&&gotI&&!ready){ready=true;}}
  db.collection('trips').onSnapshot(function(s){
    trips=s.docs.map(function(d){var o=Object.assign({},d.data());o.id=d.id;return o;}).sort(function(a,b){return (a.createdAt||0)-(b.createdAt||0);});
    gotT=true;offline=false;maybe();pickTrip();render();
  },function(){offline=true;ready=true;render();});
  db.collection('members').onSnapshot(function(s){
    var m={};s.docs.forEach(function(d){m[d.id]=Object.assign({},d.data());});members=m;render();
    if(!pushRefresh.done){pushRefresh.done=1;setTimeout(pushRefresh,1500);setTimeout(refreshBellDot,2000);}
    if(uid&&canWrite&&!members[uid]&&!nameAsked&&!modal.className){nameAsked=true;openNameForm(true);}
  },function(){});
  db.collection('items').onSnapshot(function(s){
    items=s.docs.map(function(d){var o=Object.assign({},d.data());o.id=d.id;return o;});
    gotI=true;offline=false;maybe();render();loadProfiles();
  },function(){offline=true;ready=true;render();});
}

<script>
/* 홈 화면 앱(사파리 주소창 없음)에서 맨 위에서 아래로 당기면 새로고침 */
(function(){
  var sa=false;try{sa=(window.matchMedia&&matchMedia('(display-mode: standalone)').matches)||navigator.standalone===true;}catch(e){}
  if(!sa&&!/[?&]ptr=1(&|$)/.test(location.search))return;
  var el=document.createElement('div');el.id='ptr';el.setAttribute('aria-hidden','true');
  el.innerHTML='<i style="--i:0"></i><i style="--i:1"></i><i style="--i:2"></i>';document.body.appendChild(el);
  var y0=null,x0=0,p=0,busy=false,TH=64;
  function top(){return (window.scrollY||document.documentElement.scrollTop||0)<=0;}
  function blocked(t){
    var m=document.getElementById('modal');if(m&&m.className)return true;
    if(window.dragActive)return true;
    return !!(t&&t.closest&&t.closest('.tl-map,.gf-map,.tl-mapw.big,input,textarea,select,.dh,[contenteditable]'));
  }
  function set(v){p=v;el.classList.remove('back');el.style.transform='translate(-50%,'+(Math.min(v,TH+20)-70)+'px)';el.style.opacity=String(Math.min(1,v/TH));el.classList.toggle('ok',v>=TH);}
  function reset(){y0=null;el.classList.add('back');el.classList.remove('ok');el.style.transform='translate(-50%,-70px)';el.style.opacity='0';p=0;}
  document.addEventListener('touchstart',function(e){
    if(busy||e.touches.length!==1||!top()||blocked(e.target)){y0=null;return;}
    y0=e.touches[0].clientY;x0=e.touches[0].clientX;p=0;
  },{passive:true});
  document.addEventListener('touchmove',function(e){
    if(y0==null||busy)return;
    var dy=e.touches[0].clientY-y0,dx=Math.abs(e.touches[0].clientX-x0);
    if(dy<=0||dx>dy||!top()||window.dragActive){if(p)reset();else y0=null;return;}
    set(dy*.5);
  },{passive:true});
  function end(){
    if(y0==null||busy)return;
    if(p>=TH){busy=true;el.classList.remove('ok');el.classList.add('spin','back');el.style.transform='translate(-50%,14px)';setTimeout(function(){location.reload();},350);}
    else reset();
  }
  document.addEventListener('touchend',end,{passive:true});
  document.addEventListener('touchcancel',reset,{passive:true});
})();
</script>
